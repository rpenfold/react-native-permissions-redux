name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx biome check .

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rnp-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install react-native-permissions v5
        run: npm install --legacy-peer-deps react-native-permissions@5

      - name: Test against RNP v5
        run: npm test

      - name: Typecheck against RNP v5
        run: npm run build
